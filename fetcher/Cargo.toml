[package]
name = "actu-spatiale-fetcher"
version = "0.1.0"
edition = "2024"
description = "Récupère les données actualité spatiale / Starship (Launch Library 2 + Spaceflight News) pour le site"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
